# workflow
# should have name
#workflow [No identation required for naming the workflow]
name: Hello

# on tells what the workflow should run
on: 
  workflow_dispatch: 

#jobs
#should be inside the workflow
#job tells what the workflow should do ,there can be one or more than one jobs,hence we write jobs
#job is an object so needs identation
jobs:
  say-hello:
    runs-on: ubuntu-latest
    # That empermal container will have steps to execute ,hence name those steps and use run:run has the command
    steps:
      - name: Say hello to everyone
        run: echo "Hello Dosto"

    


#steps
# should be inside the jobs

# actions
# should be inside the steps
