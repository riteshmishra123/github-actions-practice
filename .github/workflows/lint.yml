name: Auto Linter

on:
  push:
    paths: "*.py"
jobs:
  code:
    runs-on: ubuntu-latest
    # this steps will automatically clone the code of the current branch into the runner
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v4
      - name: Install Linter
        run: pip install ruff
        
